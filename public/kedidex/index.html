<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c0b0a" />
  <title>KediDex — Erişime Kapalı</title>
  <meta name="description" content="KediDex şu anda sınırlı erişimdedir." />
  <link rel="icon" type="image/png" href="/x/favicon-lily.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#0c0b0a;--ink:#e8e4dc;--muted:#7a756c;--rule:#24211d;--accent:#e8893b}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px;overflow:hidden}
    body:after{content:"";position:fixed;inset:0;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.035;mix-blend-mode:screen}
    .panel{width:min(520px,100%);text-align:center;position:relative;z-index:1}
    .mark{width:66px;height:66px;border:1px solid var(--rule);border-radius:50%;display:grid;place-items:center;margin:0 auto 22px;color:var(--muted)}
    .eyebrow{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
    h1{font-family:'Instrument Serif',Georgia,serif;font-size:clamp(2.2rem,7vw,3.7rem);font-weight:400;font-style:italic;line-height:1;margin:0 0 16px}
    p{color:var(--muted);font-size:.92rem;line-height:1.65;max-width:410px;margin:0 auto 24px}
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .btn{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;text-decoration:none;padding:11px 17px;border-radius:999px;border:1px solid var(--rule);transition:.25s ease}
    .primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
    .secondary{color:var(--ink)}
    .btn:hover{transform:translateY(-2px)}
    .meta{margin-top:28px;padding-top:16px;border-top:1px solid var(--rule);font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);opacity:.7}
  </style>
</head>
<body>
  <main class="panel">
    <div class="mark" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2"></rect>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
      </svg>
    </div>
    <div class="eyebrow">KediDex · Restricted</div>
    <h1>Erişime kapalı.</h1>
    <p>KediDex şu anda sınırlı erişimde. Projeyi görmek istiyorsan erişim talebi gönderebilirsin.</p>
    <div class="actions">
      <a class="btn primary" href="mailto:s.cagatay.sonmez@gmail.com?subject=Erişim%20talebi%20—%20KediDex">Erişim iste →</a>
      <a class="btn secondary" href="/">← Hub'a dön</a>
    </div>
    <div class="meta">snmez.xyz · private project</div>
  </main>
</body>
</html>
