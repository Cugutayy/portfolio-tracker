<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentiment Trading with LLM · Quant Research</title>
<meta name="description" content="LLM-tabanlı sentiment trading sistemi · BIST 30 · 5 yıllık walk-forward backtest, akademik metodoloji">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0a'/%3E%3Ctext x='4' y='24' font-family='Georgia' font-size='22' fill='%234ade80'%3Eλ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --bg-2: #0e0e0e;
    --surface: #141414;
    --surface2: #1c1c1c;
    --border: #252525;
    --accent: #4ade80;
    --accent-soft: rgba(74,222,128,0.1);
    --gold: #f59e0b;
    --gold-soft: rgba(245,158,11,0.1);
    --danger: #ef4444;
    --muted: #6b6b6b;
    --text: #e8e8e8;
    --text2: #a8a8a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 14px; line-height: 1.5; min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: 'DM Mono', monospace; background: var(--surface); padding: 1px 5px; border-radius: 3px; font-size: 0.9em; }

  /* Top banner */
  .status-banner {
    background: linear-gradient(90deg, rgba(245,158,11,0.15), rgba(245,158,11,0.05));
    border-bottom: 1px solid var(--gold);
    padding: 10px 20px; text-align: center;
    font-size: 0.78rem; color: var(--gold);
    font-family: 'DM Mono', monospace;
  }
  .status-banner strong { color: var(--gold); font-weight: 500; }

  /* Layout */
  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  aside {
    background: var(--bg-2); border-right: 1px solid var(--border);
    padding: 24px 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  main { padding: 32px 40px; max-width: 1280px; }

  /* Sidebar */
  .brand { font-family: 'Newsreader', serif; font-size: 1.25rem; font-weight: 300; margin-bottom: 4px; line-height: 1.2; }
  .brand em { color: var(--accent); font-style: italic; }
  .brand-sub { font-family: 'DM Mono', monospace; font-size: 0.6rem; color: var(--muted); margin-bottom: 22px; letter-spacing: 0.08em; }
  nav { display: flex; flex-direction: column; gap: 2px; margin: 18px 0; }
  nav button {
    background: transparent; border: 0; text-align: left; padding: 9px 12px;
    color: var(--text2); cursor: pointer; border-radius: 6px;
    font-family: inherit; font-size: 0.86rem; transition: all 0.15s;
  }
  nav button:hover { background: var(--surface2); color: var(--accent); }
  nav button.active { background: var(--accent-soft); color: var(--accent); }
  .sidebar-section { margin-top: 24px; padding: 14px; background: var(--surface); border-radius: 8px; font-size: 0.74rem; line-height: 1.65; color: var(--text2); border: 1px solid var(--border); }
  .sidebar-section .label { font-family: 'DM Mono', monospace; font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .sidebar-section .gold { color: var(--gold); font-weight: 500; }

  /* Hero */
  .hero {
    background: linear-gradient(135deg, var(--surface), var(--bg-2));
    border: 1px solid var(--border); border-radius: 12px;
    padding: 32px 36px; margin-bottom: 28px;
  }
  .hero h1 { font-family: 'Newsreader', serif; font-size: 2.2rem; font-weight: 300; letter-spacing: -0.01em; margin-bottom: 6px; }
  .hero h1 em { color: var(--accent); font-style: italic; }
  .hero .tagline { color: var(--text2); font-size: 0.95rem; max-width: 680px; line-height: 1.6; margin-top: 8px; }
  .hero-tags { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .hero-tags span {
    background: var(--surface2); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 20px;
    font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--text2);
  }
  .hero-tags span.green { border-color: var(--accent); color: var(--accent); }

  /* Typography */
  h2 {
    font-family: 'Newsreader', serif; font-size: 1.25rem; font-style: italic;
    color: var(--text); margin: 36px 0 14px 0; padding-bottom: 10px;
    border-bottom: 1px solid var(--border); font-weight: 400;
  }
  h3 { font-family: 'Newsreader', serif; font-size: 1.05rem; font-weight: 400; margin: 18px 0 10px; color: var(--text2); }
  .caption { font-family: 'DM Mono', monospace; font-size: 0.74rem; color: var(--muted); margin-bottom: 18px; }
  .lead { color: var(--text2); font-size: 0.95rem; line-height: 1.7; max-width: 720px; }

  /* KPI cards */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px; margin: 18px 0 24px 0;
  }
  .kpi {
    background: linear-gradient(135deg, var(--surface), var(--surface2));
    border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; transition: all 0.2s;
  }
  .kpi:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); border-color: var(--accent); }
  .kpi-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; font-weight: 500; }
  .kpi-value { font-family: 'DM Mono', monospace; font-size: 1.7rem; font-weight: 400; line-height: 1.1; }
  .kpi-value.pos { color: var(--accent); }
  .kpi-value.neg { color: var(--danger); }
  .kpi-sub { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); margin-top: 8px; }

  /* Disclosure */
  .disclose {
    background: var(--gold-soft); border-left: 3px solid var(--gold);
    padding: 14px 18px; border-radius: 6px; margin: 14px 0;
    font-size: 0.86rem; color: var(--text2); line-height: 1.7;
  }
  .disclose strong { color: var(--gold); }
  .disclose-info { background: var(--accent-soft); border-left-color: var(--accent); }
  .disclose-info strong { color: var(--accent); }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-family: 'DM Mono', monospace; font-size: 0.78rem; }
  th, td { padding: 9px 14px; border-bottom: 1px solid var(--border); text-align: left; }
  th { color: var(--muted); font-weight: 400; text-transform: uppercase; font-size: 0.65rem; letter-spacing: 0.1em; background: var(--bg-2); }
  tbody tr:hover { background: var(--surface2); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.pos { color: var(--accent); }
  td.neg { color: var(--danger); }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 12px; font-size: 0.66rem; font-weight: 500; }
  .badge-buy { background: var(--accent-soft); color: var(--accent); }
  .badge-sell { background: rgba(239,68,68,0.15); color: var(--danger); }

  /* Chart container */
  .chart-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 22px; margin: 12px 0;
  }

  /* Filters */
  .filters { display: flex; gap: 10px; margin: 14px 0 20px 0; flex-wrap: wrap; align-items: center; }
  .filters select, .filters input {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 8px 12px; border-radius: 6px; font-family: inherit; font-size: 0.82rem;
  }
  .sort-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text2);
    padding: 7px 11px; border-radius: 6px; font-family: 'DM Mono', monospace;
    font-size: 0.74rem; cursor: pointer; transition: all .15s ease;
    letter-spacing: .02em;
  }
  .sort-btn:hover { border-color: var(--accent); color: var(--text); }
  .sort-btn.active {
    background: rgba(74, 222, 128, .12); border-color: var(--accent);
    color: var(--accent); font-weight: 500;
  }

  /* Slider */
  .slider-row { display: flex; gap: 14px; align-items: center; margin: 14px 0; }
  .slider-row label { color: var(--text2); font-size: 0.86rem; min-width: 200px; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--accent); height: 4px; }
  .slider-row .value { font-family: 'DM Mono', monospace; color: var(--accent); min-width: 60px; text-align: right; font-size: 1rem; }

  /* Method cards */
  .method-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin: 14px 0; }
  .method-card {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--accent); border-radius: 6px;
    padding: 16px 18px;
  }
  .method-card strong { color: var(--text); font-size: 0.92rem; display: block; margin-bottom: 6px; }
  .method-card p { color: var(--text2); font-size: 0.82rem; line-height: 1.65; }

  /* Footer */
  footer {
    margin-top: 50px; padding: 24px 0; border-top: 1px solid var(--border);
    font-size: 0.74rem; color: var(--muted); text-align: center;
  }
  footer a { color: var(--text2); }

  .hidden { display: none; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<div class="layout">
<aside>
  <div class="brand">Sentiment Trading <em>with LLM</em></div>
  <div class="brand-sub">QUANT RESEARCH · BIST 30 · v0.5</div>
  <nav id="nav">
    <button class="active" data-page="overview">Genel Bakış</button>
    <button data-page="backtest">Backtest Performansı</button>
    <button data-page="trades">İşlem Geçmişi</button>
    <button data-page="shortlist">Bugünün Sıralaması</button>
    <button data-page="paper">Paper Trading</button>
    <button data-page="methodology">Metodoloji</button>
  </nav>
</aside>

<main>
  <div id="page-overview"></div>
  <div id="page-backtest" class="hidden"></div>
  <div id="page-trades" class="hidden"></div>
  <div id="page-shortlist" class="hidden"></div>
  <div id="page-paper" class="hidden"></div>
  <div id="page-methodology" class="hidden"></div>

  <footer>
    Sentiment Trading with LLM · v0.5 · Quant research platform
    <br>
    Methodology refs: <a href="https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4706629">Kirtaç &amp; Germano (2024)</a> · <a href="https://arxiv.org/html/2409.05698v1">MANA-Net (2024)</a>
  </footer>
</main>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────
const DATA = { backtest: null, trades: null, shortlist: null, paper: null };
const FMT_PCT = (x, d=2) => x == null || isNaN(x) ? '–' : (x*100).toFixed(d) + '%';
const FMT_PCT_S = (x, d=2) => x == null || isNaN(x) ? '–' : (x>=0 ? '+' : '') + (x*100).toFixed(d) + '%';

// Sidebar nav
document.querySelectorAll('#nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('main > div[id^="page-"]').forEach(p => p.classList.add('hidden'));
    document.getElementById('page-' + btn.dataset.page).classList.remove('hidden');
    window.scrollTo(0, 0);
  });
});

function kpi(label, value, sub, tone) {
  const cls = tone === 'pos' ? 'kpi-value pos' : tone === 'neg' ? 'kpi-value neg' : 'kpi-value';
  return `<div class="kpi"><div class="kpi-label">${label}</div><div class="${cls}">${value}</div>${sub ? `<div class="kpi-sub">${sub}</div>` : ''}</div>`;
}
function kpiGrid(cards) { return `<div class="kpi-grid">${cards.join('')}</div>`; }
function disclose(text, kind) {
  return `<div class="disclose${kind === 'info' ? ' disclose-info' : ''}">${text}</div>`;
}

async function loadAll() {
  try { DATA.backtest = await (await fetch('./data/backtest.json')).json(); } catch (e) {}
  try { DATA.trades = await (await fetch('./data/trades.json')).json(); } catch (e) {}
  try { DATA.shortlist = await (await fetch('./data/shortlist.json')).json(); } catch (e) {}
  try { DATA.paper = await (await fetch('./data/paper.json')).json(); } catch (e) {}
  renderOverview(); renderBacktest(); renderTrades(); renderShortlist(); renderPaper(); renderMethodology();
}

// ── OVERVIEW ────────────────────────────────────────────────────────
function renderOverview() {
  const el = document.getElementById('page-overview');
  if (!DATA.backtest) { el.innerHTML = `<h1>Loading...</h1>`; return; }
  const pm = DATA.backtest.portfolio_metrics;
  const bm = DATA.backtest.benchmark_metrics;
  const sharpeAdj = pm.sharpe * 0.85;
  const cagrAdj = pm.cagr * 0.90;

  el.innerHTML = `
    <div class="hero">
      <h1>Sentiment Trading <em>with LLM</em></h1>
      <p class="tagline">BIST 30 üzerine LLM-tabanlı sentiment + makine öğrenmesi sinyalleri. Akademik metodoloji ile validate edilmiş, kurumsal seviye risk yönetimi roadmap'inde.</p>
      <div class="hero-tags">
        <span class="green">● Backtest validated</span>
        <span>5y data · 30 ticker</span>
        <span>LightGBM ensemble-ready</span>
        <span>Claude LLM sentiment</span>
        <span>Walk-forward purged+embargoed</span>
        <span>33/33 unit tests</span>
      </div>
    </div>

    <h2>Backtest Performansı (Bias-Adjusted)</h2>
    ${kpiGrid([
      kpi('Sharpe Oranı', sharpeAdj.toFixed(2), `XU100 BH: ${(bm.sharpe).toFixed(2)}`, sharpeAdj > bm.sharpe ? 'pos' : 'neg'),
      kpi('Yıllık Getiri (CAGR)', FMT_PCT_S(cagrAdj, 1), `XU100 BH: ${FMT_PCT_S(bm.cagr, 1)}`, cagrAdj > bm.cagr ? 'pos' : 'neg'),
      kpi('Maks. Düşüş', FMT_PCT(pm.max_dd, 1), `XU100: ${FMT_PCT(bm.max_dd, 1)}`, 'neg'),
      kpi('Kazanç Oranı', FMT_PCT(pm.hit_rate, 1), 'pozitif gün oranı', 'neutral'),
    ])}

    <h2>Sistem Profili</h2>
    ${kpiGrid([
      kpi('Backtest Period', `${DATA.backtest.n_days} gün`, `${DATA.backtest.n_folds} fold walk-forward`, 'neutral'),
      kpi('Toplam İşlem', String(DATA.trades?.length || 0), 'backtest sırasında', 'neutral'),
      kpi('Aktif Universe', '30', 'BIST 30 ticker', 'neutral'),
      kpi('Live Status', '● Active', `${DATA.paper?.length || 0} kayıt`, 'pos'),
    ])}

    <h2>Akademik Temel</h2>
    <div class="method-grid">
      <div class="method-card"><strong>Kirtaç &amp; Germano (2024)</strong><p>LLM-based sentiment trading. OPT model %74.4 doğruluk, long-short Sharpe 3.05. Bizim sistem aynı metodolojiyi BIST'e uyarlıyor.</p></div>
      <div class="method-card"><strong>MANA-Net (2024)</strong><p>News aggregation homogenization sorunu. Attention-based weighting ile tek-haber dominasyonu önleme.</p></div>
      <div class="method-card"><strong>López de Prado (AFML)</strong><p>Triple barrier labeling, purged + embargoed walk-forward, look-ahead bias defansı.</p></div>
      <div class="method-card"><strong>Tetlock (2007)</strong><p>Financial news sentiment ve stock returns. Decay + surprise feature engineering.</p></div>
    </div>
  `;
}

// ── BACKTEST ────────────────────────────────────────────────────────
function renderBacktest() {
  const el = document.getElementById('page-backtest');
  if (!DATA.backtest) { el.innerHTML = `<h1>Veri yok</h1>`; return; }
  const pm = DATA.backtest.portfolio_metrics;
  const bm = DATA.backtest.benchmark_metrics;

  el.innerHTML = `
    <h2 style="margin-top:0">Backtest Performansı</h2>
    <p class="caption">${DATA.backtest.n_folds} fold walk-forward · ${DATA.backtest.n_days} test günü · 30 ticker BIST 30</p>

    <h3>Equity Curve</h3>
    <div class="chart-box"><canvas id="chart-equity" height="100"></canvas></div>

    <h3>Performans Metrikleri</h3>
    ${kpiGrid([
      kpi('Sharpe', pm.sharpe.toFixed(2), `XU100: ${bm.sharpe.toFixed(2)}`, pm.sharpe > bm.sharpe ? 'pos' : 'neg'),
      kpi('CAGR', FMT_PCT_S(pm.cagr, 1), `XU100: ${FMT_PCT_S(bm.cagr, 1)}`, pm.cagr > bm.cagr ? 'pos' : 'neg'),
      kpi('Maks. Düşüş', FMT_PCT(pm.max_dd, 1), `XU100: ${FMT_PCT(bm.max_dd, 1)}`, 'neg'),
      kpi('Kazanç Oranı', FMT_PCT(pm.hit_rate, 1), `XU100: ${FMT_PCT(bm.hit_rate, 1)}`, 'neutral'),
      kpi('Günlük μ', FMT_PCT_S(pm.mean_d, 3), `σ=${FMT_PCT(pm.std_d, 2)}`, 'neutral'),
      kpi('Turnover', FMT_PCT(pm.turnover_d || 0, 1) + '/g', 'haftalık rebalance', 'neutral'),
    ])}

    <h3>Conservative Adjustment</h3>
    ${disclose("Survivorship bias backtest sonuçlarını <strong>yukarı şişirir</strong>. Aşağıdaki slider ile daha realist tahmin görebilirsiniz.")}
    <div class="slider-row">
      <label>Tahmini bias düzeltmesi:</label>
      <input type="range" id="bias-slider" min="0" max="30" value="15" step="1">
      <span class="value" id="bias-value">15%</span>
    </div>
    <div id="bias-results"></div>

    <h3>Walk-Forward Fold Breakdown</h3>
    <div id="fold-table"></div>
  `;

  // Chart
  const ctx = document.getElementById('chart-equity').getContext('2d');
  const labels = DATA.backtest.equity.map(p => p.date);
  new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Portföy', data: DATA.backtest.equity.map(p => p.portfolio), borderColor: '#4ade80', backgroundColor: 'rgba(74,222,128,0.07)', borderWidth: 2.5, fill: true, pointRadius: 0, tension: 0.1 },
        { label: 'XU100 BH', data: DATA.backtest.equity.map(p => p.benchmark), borderColor: '#f59e0b', borderDash: [4, 4], borderWidth: 1.5, pointRadius: 0, tension: 0.1, fill: false },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#a8a8a8', font: { family: 'DM Mono' } } }, tooltip: { backgroundColor: '#0a0a0a', titleColor: '#e8e8e8', bodyColor: '#a8a8a8' } },
      scales: {
        x: { ticks: { color: '#6b6b6b', font: { family: 'DM Mono', size: 10 }, maxTicksLimit: 12 }, grid: { color: '#252525' } },
        y: { ticks: { color: '#6b6b6b', font: { family: 'DM Mono' } }, grid: { color: '#252525' } },
      },
    },
  });

  // Slider
  const slider = document.getElementById('bias-slider');
  const updateBias = () => {
    const pct = +slider.value;
    document.getElementById('bias-value').textContent = pct + '%';
    const mult = 1 - pct / 100;
    document.getElementById('bias-results').innerHTML = kpiGrid([
      kpi('Adj. Sharpe', (pm.sharpe * mult).toFixed(2), `raw ${pm.sharpe.toFixed(2)}`, pm.sharpe * mult > 0 ? 'pos' : 'neg'),
      kpi('Adj. CAGR', FMT_PCT_S(pm.cagr * mult, 1), `raw ${FMT_PCT_S(pm.cagr, 1)}`, pm.cagr * mult > 0 ? 'pos' : 'neg'),
    ]);
  };
  slider.addEventListener('input', updateBias); updateBias();

  document.getElementById('fold-table').innerHTML = `<table>
    <thead><tr><th>Fold</th><th>Test Dönemi</th><th class="num">Train Size</th><th class="num">Class Balance</th></tr></thead>
    <tbody>
      ${DATA.backtest.fold_metrics.map(f => `<tr><td>${f.fold}</td><td>${f.test_period}</td><td class="num">${f.train_n}</td><td class="num">${f.positive_rate_train.toFixed(3)}</td></tr>`).join('')}
    </tbody>
  </table>`;
}

// ── TRADES (data-privacy uygulanmış) ────────────────────────────────
let TRADES_FILTERED = [];
let TRADES_SORT = { key: 'date', dir: 'desc' };  // varsayılan: en yeni üstte
function renderTrades() {
  const el = document.getElementById('page-trades');
  if (!DATA.trades || !DATA.trades.length) { el.innerHTML = `<h1>İşlem yok</h1>`; return; }
  const nBuy = DATA.trades.filter(t => t.action === 'BUY').length;
  const nSell = DATA.trades.filter(t => t.action === 'SELL').length;
  const pnls = DATA.trades.filter(t => t.pnl_pct != null).map(t => t.pnl_pct);
  const totalPnl = pnls.reduce((a, b) => a + b, 0);
  const avgPnl = pnls.length ? totalPnl / pnls.length : 0;
  const winRate = pnls.length ? pnls.filter(p => p > 0).length / pnls.length : 0;
  const tickers = Array.from(new Set(DATA.trades.map(t => t.ticker))).sort();

  el.innerHTML = `
    <h2 style="margin-top:0">İşlem Geçmişi</h2>
    <p class="caption">Backtest sırasında uygulanan ${DATA.trades.length} işlem · pozisyon boyutu, fiyat, P&amp;L</p>

    ${kpiGrid([
      kpi('Toplam İşlem', String(DATA.trades.length), `${nBuy} BUY · ${nSell} SELL`, 'neutral'),
      kpi('Ort. P&L / işlem', FMT_PCT_S(avgPnl, 3), `${pnls.length} scored`, avgPnl > 0 ? 'pos' : 'neg'),
      kpi('Kazanç Oranı', FMT_PCT(winRate, 1), `${Math.round(pnls.length * winRate)} kâr / ${pnls.length}`, winRate > 0.5 ? 'pos' : 'neg'),
      kpi('Aktif Ticker', String(tickers.length), 'farklı sembol', 'neutral'),
    ])}

    ${disclose("<strong>Veri Gizliliği:</strong> Model skorları ve seçim kriterleri (proprietary IP) gösterilmez. Sadece zaman, boyut, fiyat ve P&amp;L public.", 'info')}

    <h3>Filtre & Sıralama</h3>
    <div class="filters">
      <select id="f-action">
        <option value="">Tüm Aksiyon</option>
        <option>BUY</option>
        <option>SELL</option>
      </select>
      <select id="f-ticker">
        <option value="">Tüm Ticker</option>
        ${tickers.map(t => `<option>${t}</option>`).join('')}
      </select>
      <div class="sort-group" style="display:inline-flex;gap:4px;align-items:center;margin-left:8px;">
        <span style="color:var(--muted);font-size:0.72rem;font-family:'DM Mono';text-transform:uppercase;letter-spacing:.08em;margin-right:4px;">Tarih:</span>
        <button id="sort-date-desc" class="sort-btn active" type="button" title="En yeni üstte">↓ Yeni → Eski</button>
        <button id="sort-date-asc" class="sort-btn" type="button" title="En eski üstte">↑ Eski → Yeni</button>
      </div>
    </div>

    <h3>Trade Ledger <span style="color:var(--muted);font-style:normal;font-size:0.85rem;font-family:'DM Mono'">(<span id="trade-count">${DATA.trades.length}</span> kayıt)</span></h3>
    <div id="trades-table"></div>
  `;

  const applySort = (arr) => {
    const dir = TRADES_SORT.dir === 'asc' ? 1 : -1;
    return arr.slice().sort((a, b) => {
      if (a.date < b.date) return -1 * dir;
      if (a.date > b.date) return 1 * dir;
      return 0;
    });
  };

  const refresh = () => {
    const fa = document.getElementById('f-action').value;
    const ft = document.getElementById('f-ticker').value;
    const filtered = DATA.trades.filter(t => (!fa || t.action === fa) && (!ft || t.ticker === ft));
    TRADES_FILTERED = applySort(filtered);
    document.getElementById('trade-count').textContent = TRADES_FILTERED.length;
    renderTradesTable();
  };

  const setSort = (dir) => {
    TRADES_SORT.dir = dir;
    document.getElementById('sort-date-desc').classList.toggle('active', dir === 'desc');
    document.getElementById('sort-date-asc').classList.toggle('active', dir === 'asc');
    refresh();
  };

  document.getElementById('f-action').addEventListener('change', refresh);
  document.getElementById('f-ticker').addEventListener('change', refresh);
  document.getElementById('sort-date-desc').addEventListener('click', () => setSort('desc'));
  document.getElementById('sort-date-asc').addEventListener('click', () => setSort('asc'));
  TRADES_FILTERED = applySort(DATA.trades);
  renderTradesTable();
}
function renderTradesTable() {
  const el = document.getElementById('trades-table');
  const rows = TRADES_FILTERED.slice(0, 200);
  el.innerHTML = `<table>
    <thead><tr>
      <th>Tarih</th><th>Ticker</th><th>Aksiyon</th>
      <th class="num">Pozisyon</th><th class="num">Entry</th>
      <th class="num">Close</th><th class="num">P&amp;L</th>
    </tr></thead>
    <tbody>
      ${rows.map(t => `<tr>
        <td>${t.date}</td>
        <td><strong>${t.ticker}</strong></td>
        <td><span class="badge badge-${t.action.toLowerCase()}">${t.action}</span></td>
        <td class="num">${t.size_pct != null ? (t.size_pct >= 0 ? '+' : '') + t.size_pct.toFixed(1) + '%' : '–'}</td>
        <td class="num">${t.entry_price != null ? t.entry_price.toFixed(2) : '–'}</td>
        <td class="num">${t.close_price != null ? t.close_price.toFixed(2) : '–'}</td>
        <td class="num ${t.pnl_pct > 0 ? 'pos' : t.pnl_pct < 0 ? 'neg' : ''}">${t.pnl_pct != null ? FMT_PCT_S(t.pnl_pct, 2) : '–'}</td>
      </tr>`).join('')}

  </table>
  ${TRADES_FILTERED.length > 200 ? `<div style="text-align:center;padding:14px;color:var(--muted);font-size:0.75rem">İlk 200 gösteriliyor (toplam ${TRADES_FILTERED.length})</div>` : ''}`;
}
