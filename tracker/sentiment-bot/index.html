<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentiment Trading with LLM · Quant Research</title>
<meta name="description" content="LLM-tabanlı sentiment trading sistemi · BIST 30 · 5 yıllık walk-forward backtest, akademik metodoloji">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0a'/%3E%3Ctext x='4' y='24' font-family='Georgia' font-size='22' fill='%234ade80'%3Eλ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --bg-2: #0e0e0e;
    --surface: #141414;
    --surface2: #1c1c1c;
    --border: #252525;
    --accent: #4ade80;
    --accent-soft: rgba(74,222,128,0.1);
    --gold: #f59e0b;
    --gold-soft: rgba(245,158,11,0.1);
    --danger: #ef4444;
    --muted: #6b6b6b;
    --text: #e8e8e8;
    --text2: #a8a8a8;
    --chart-grid: #252525;
    --chart-tick: #6b6b6b;
    --topbar-bg: rgba(10,10,10,0.85);
  }
  :root[data-theme="light"] {
    --bg: #faf9f6;
    --bg-2: #f3f1ec;
    --surface: #ffffff;
    --surface2: #efece5;
    --border: #d8d4c8;
    --accent: #16a34a;
    --accent-soft: rgba(22,163,74,0.10);
    --gold: #b45309;
    --gold-soft: rgba(180,83,9,0.10);
    --danger: #b91c1c;
    --muted: #8a8578;
    --text: #1a1817;
    --text2: #4a463e;
    --chart-grid: #d8d4c8;
    --chart-tick: #8a8578;
    --topbar-bg: rgba(250,249,246,0.85);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 14px; line-height: 1.5; min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: 'DM Mono', monospace; background: var(--surface); padding: 1px 5px; border-radius: 3px; font-size: 0.9em; }

  /* Market banner */
  .market-banner {
    background: linear-gradient(90deg, rgba(245,158,11,0.10), rgba(245,158,11,0.04));
    border-bottom: 1px solid var(--gold);
    padding: 8px 24px;
    display: flex; align-items: center; gap: 12px;
    font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--gold);
  }
  .market-banner.open {
    background: linear-gradient(90deg, rgba(74,222,128,0.08), rgba(74,222,128,0.02));
    border-bottom-color: var(--accent);
    color: var(--accent);
  }
  .market-dot {
    width: 7px; height: 7px; border-radius: 50%; background: currentColor;
    box-shadow: 0 0 8px currentColor;
  }
  .market-banner strong { font-weight: 500; }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--topbar-bg); backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px; height: 48px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-left { display: flex; align-items: center; gap: 18px; }
  .hub-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text2); padding: 5px 12px; border-radius: 6px;
    font-family: 'DM Mono', monospace; font-size: 0.72rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s;
  }
  .hub-btn:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; }
  .topbar-title {
    font-family: 'Newsreader', serif; font-size: 0.92rem; font-weight: 400;
    color: var(--text2); font-style: italic;
  }
  .topbar-right { display: flex; align-items: center; gap: 4px; }
  .lang-btn {
    background: none; border: 1px solid var(--border); border-radius: 5px;
    width: 30px; height: 22px; cursor: pointer; padding: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.5; transition: all .2s;
  }
  .lang-btn.active { opacity: 1; border-color: var(--accent); }
  .lang-btn svg { width: 20px; height: 14px; display: block; }
  .theme-toggle {
    width: 52px; height: 26px; padding: 3px; border-radius: 99px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg);
    transition: all .3s; margin-left: 8px; position: relative;
    display: flex; align-items: center;
  }
  .theme-toggle-knob {
    width: 18px; height: 18px; border-radius: 50%;
    transition: all .3s cubic-bezier(.16,1,.3,1);
    position: absolute; left: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
  }
  :root[data-theme="dark"] .theme-toggle-knob { transform: translateX(26px); background: #252420; color: #fbbf24; }
  :root[data-theme="light"] .theme-toggle-knob { transform: translateX(0); background: #e8e4dc; color: #8a8578; }

  /* Layout */
  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 48px); }
  aside {
    background: var(--bg-2); border-right: 1px solid var(--border);
    padding: 24px 18px; position: sticky; top: 48px; height: calc(100vh - 48px); overflow-y: auto;
  }
  main { padding: 32px 40px; max-width: 1280px; }

  /* Sidebar */
  .brand { font-family: 'Newsreader', serif; font-size: 1.25rem; font-weight: 300; margin-bottom: 4px; line-height: 1.2; }
  .brand em { color: var(--accent); font-style: italic; }
  .brand-sub { font-family: 'DM Mono', monospace; font-size: 0.6rem; color: var(--muted); margin-bottom: 22px; letter-spacing: 0.08em; }
  nav { display: flex; flex-direction: column; gap: 2px; margin: 18px 0; }
  nav button {
    background: transparent; border: 0; text-align: left; padding: 9px 12px;
    color: var(--text2); cursor: pointer; border-radius: 6px;
    font-family: inherit; font-size: 0.86rem; transition: all 0.15s;
  }
  nav button:hover { background: var(--surface2); color: var(--accent); }
  nav button.active { background: var(--accent-soft); color: var(--accent); }
  .sidebar-section { margin-top: 24px; padding: 14px; background: var(--surface); border-radius: 8px; font-size: 0.74rem; line-height: 1.65; color: var(--text2); border: 1px solid var(--border); }
  .sidebar-section .label { font-family: 'DM Mono', monospace; font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .sidebar-section .gold { color: var(--gold); font-weight: 500; }

  /* Hero */
  .hero {
    background: linear-gradient(135deg, var(--surface), var(--bg-2));
    border: 1px solid var(--border); border-radius: 12px;
    padding: 32px 36px; margin-bottom: 28px;
  }
  .hero h1 { font-family: 'Newsreader', serif; font-size: 2.2rem; font-weight: 300; letter-spacing: -0.01em; margin-bottom: 6px; }
  .hero h1 em { color: var(--accent); font-style: italic; }
  .hero .tagline { color: var(--text2); font-size: 0.95rem; max-width: 680px; line-height: 1.6; margin-top: 8px; }
  .hero-tags { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .hero-tags span {
    background: var(--surface2); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 20px;
    font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--text2);
  }
  .hero-tags span.green { border-color: var(--accent); color: var(--accent); }

  /* Modern hero (with sparkline) */
  .hero-modern {
    display: grid; grid-template-columns: 1.4fr 1fr; gap: 28px; align-items: center;
    background: radial-gradient(ellipse at top right, rgba(74,222,128,.06), transparent 60%), linear-gradient(135deg, var(--surface), var(--bg-2));
    position: relative; overflow: hidden;
  }
  .hero-modern::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: .35;
  }
  .hero-tags-top {
    display: inline-flex; align-items: center; gap: 10px; margin-bottom: 14px;
    font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: .06em;
    color: var(--text2);
  }
  .hero-status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 12px var(--accent); animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(74,222,128,.6); }
    50% { box-shadow: 0 0 0 6px rgba(74,222,128,0); }
  }
  .hero-status-label { color: var(--accent); font-weight: 500; text-transform: uppercase; }
  .hero-divider { width: 1px; height: 12px; background: var(--border); }
  .hero-mono { font-family: 'DM Mono', monospace; }
  .hero-spark {
    background: rgba(0,0,0,.18); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; backdrop-filter: blur(4px);
  }
  :root[data-theme="light"] .hero-spark { background: rgba(255,255,255,.45); }
  .spark-label { display: flex; align-items: baseline; gap: 10px; }
  .spark-val {
    font-family: 'DM Mono', monospace; font-size: 1.7rem; font-weight: 500;
    line-height: 1; letter-spacing: -0.01em;
  }
  .spark-val.pos { color: var(--accent); }
  .spark-val.neg { color: var(--danger); }
  .spark-sub {
    font-family: 'DM Mono', monospace; font-size: 0.62rem;
    color: var(--muted); text-transform: uppercase; letter-spacing: .1em;
  }
  .spark-legend {
    display: flex; gap: 14px; margin-top: 6px;
    font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--muted);
  }
  .legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 2px; display: inline-block; border-radius: 1px; }
  .dot-port { background: var(--accent); }
  .dot-bench { background: var(--gold); }
  @media (max-width: 880px) {
    .hero-modern { grid-template-columns: 1fr; }
  }

  /* Pillar cards (Overview foundation) */
  .pillar-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .pillar {
    position: relative; padding-top: 38px;
    border-left: 0; border-top: 3px solid var(--accent);
    background: linear-gradient(180deg, var(--surface), var(--bg-2));
  }
  .pillar-num {
    position: absolute; top: 14px; right: 16px;
    font-family: 'DM Mono', monospace; font-size: 0.65rem;
    color: var(--muted); letter-spacing: .15em;
  }
  .pillar strong { font-size: 0.95rem; font-family: 'Newsreader', serif; font-style: italic; font-weight: 400; color: var(--accent); }

  /* Typography */
  h2 {
    font-family: 'Newsreader', serif; font-size: 1.25rem; font-style: italic;
    color: var(--text); margin: 36px 0 14px 0; padding-bottom: 10px;
    border-bottom: 1px solid var(--border); font-weight: 400;
  }
  h3 { font-family: 'Newsreader', serif; font-size: 1.05rem; font-weight: 400; margin: 18px 0 10px; color: var(--text2); }
  .caption { font-family: 'DM Mono', monospace; font-size: 0.74rem; color: var(--muted); margin-bottom: 18px; }
  .lead { color: var(--text2); font-size: 0.95rem; line-height: 1.7; max-width: 720px; }

  /* KPI cards */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px; margin: 18px 0 24px 0;
  }
  .kpi {
    background: linear-gradient(135deg, var(--surface), var(--surface2));
    border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; transition: all 0.2s;
  }
  .kpi:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); border-color: var(--accent); }
  .kpi-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; font-weight: 500; }
  .kpi-value { font-family: 'DM Mono', monospace; font-size: 1.7rem; font-weight: 400; line-height: 1.1; }
  .kpi-value.pos { color: var(--accent); }
  .kpi-value.neg { color: var(--danger); }
  .kpi-sub { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); margin-top: 8px; }

  /* Disclosure */
  .disclose {
    background: var(--gold-soft); border-left: 3px solid var(--gold);
    padding: 14px 18px; border-radius: 6px; margin: 14px 0;
    font-size: 0.86rem; color: var(--text2); line-height: 1.7;
  }
  .disclose strong { color: var(--gold); }
  .disclose-info { background: var(--accent-soft); border-left-color: var(--accent); }
  .disclose-info strong { color: var(--accent); }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-family: 'DM Mono', monospace; font-size: 0.78rem; }
  th, td { padding: 9px 14px; border-bottom: 1px solid var(--border); text-align: left; }
  th { color: var(--muted); font-weight: 400; text-transform: uppercase; font-size: 0.65rem; letter-spacing: 0.1em; background: var(--bg-2); }
  tbody tr:hover { background: var(--surface2); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.pos { color: var(--accent); }
  td.neg { color: var(--danger); }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 12px; font-size: 0.66rem; font-weight: 500; }
  .badge-buy { background: var(--accent-soft); color: var(--accent); }
  .badge-sell { background: rgba(239,68,68,0.15); color: var(--danger); }

  /* Chart container */
  .chart-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 22px; margin: 12px 0;
  }

  /* Filters */
  .filters { display: flex; gap: 10px; margin: 14px 0 20px 0; flex-wrap: wrap; align-items: center; }
  .filters select, .filters input {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 8px 12px; border-radius: 6px; font-family: inherit; font-size: 0.82rem;
  }
  .sort-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text2);
    padding: 7px 11px; border-radius: 6px; font-family: 'DM Mono', monospace;
    font-size: 0.74rem; cursor: pointer; transition: all .15s ease;
    letter-spacing: .02em;
  }
  .sort-btn:hover { border-color: var(--accent); color: var(--text); }
  .sort-btn.active {
    background: rgba(74, 222, 128, .12); border-color: var(--accent);
    color: var(--accent); font-weight: 500;
  }

  /* Slider */
  .slider-row { display: flex; gap: 14px; align-items: center; margin: 14px 0; }
  .slider-row label { color: var(--text2); font-size: 0.86rem; min-width: 200px; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--accent); height: 4px; }
  .slider-row .value { font-family: 'DM Mono', monospace; color: var(--accent); min-width: 60px; text-align: right; font-size: 1rem; }

  /* Heatmap */
  .heatmap-wrap {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; margin: 12px 0 20px;
  }
  .heatmap { width: 100%; border-collapse: separate; border-spacing: 2px; font-family: 'DM Mono', monospace; }
  .heatmap th, .heatmap td { padding: 0; text-align: center; }
  .heatmap thead th {
    color: var(--muted); font-size: 0.6rem; font-weight: 400; text-transform: uppercase;
    letter-spacing: .08em; padding-bottom: 6px; background: transparent; border: 0;
  }
  .heatmap .year-label {
    color: var(--muted); font-size: 0.7rem; padding-right: 10px; text-align: right;
    background: transparent; border: 0;
  }
  .heatmap tbody td {
    width: 56px; height: 28px; border-radius: 4px; font-size: 0.66rem;
    color: var(--text); transition: transform .15s;
    border: 0;
  }
  .heatmap tbody td:hover { transform: scale(1.06); outline: 1px solid var(--accent); }
  .heatmap tbody td span { display: inline-block; }
  .heatmap .ytd { color: var(--muted); padding-left: 8px; }
  .heatmap .ytd-cell {
    font-size: 0.68rem; padding-left: 10px; background: transparent;
    text-align: right; font-weight: 500;
  }
  .heatmap .ytd-cell.pos { color: var(--accent); }
  .heatmap .ytd-cell.neg { color: var(--danger); }

  /* PnL histogram */
  .pnl-histogram {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 22px; margin: 12px 0 24px;
  }
  .histo-svg-wrap { position: relative; }

  /* Timeline */
  .timeline {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: stretch;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 22px; margin: 14px 0 22px;
  }
  .timeline-block {
    padding: 4px 8px;
  }
  .timeline-block .label {
    font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px;
  }
  .timeline-block .range {
    font-family: 'DM Mono', monospace; font-size: 0.88rem; color: var(--text);
    margin-bottom: 4px;
  }
  .timeline-block .sub { font-size: 0.74rem; color: var(--text2); }
  .timeline-block.backtest { border-left: 3px solid var(--gold); padding-left: 12px; }
  .timeline-block.live { border-left: 3px solid var(--accent); padding-left: 12px; }
  .timeline-arrow {
    display: flex; align-items: center; color: var(--muted);
    font-family: 'DM Mono', monospace; font-size: 1.2rem;
  }

  /* Method cards */
  .method-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin: 14px 0; }
  .method-card {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--accent); border-radius: 6px;
    padding: 16px 18px;
  }
  .method-card strong { color: var(--text); font-size: 0.92rem; display: block; margin-bottom: 6px; }
  .method-card p { color: var(--text2); font-size: 0.82rem; line-height: 1.65; }

  /* Footer */
  footer {
    margin-top: 50px; padding: 24px 0; border-top: 1px solid var(--border);
    font-size: 0.74rem; color: var(--muted); text-align: center;
  }
  footer a { color: var(--text2); }

  .hidden { display: none; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<div id="market-banner" style="display:none"></div>

<div class="topbar">
  <div class="topbar-left">
    <a href="/" class="hub-btn" title="Hub">← <span data-i18n="hub">Hub</span></a>
    <span class="topbar-title">Sentiment Trading <em style="color:var(--accent)">with LLM</em></span>
  </div>
  <div class="topbar-right">
    <button class="lang-btn" data-lang="tr" title="Türkçe">
      <svg viewBox="0 0 1200 800"><rect fill="#E30A17" width="1200" height="800"/><circle fill="#fff" cx="480" cy="400" r="200"/><circle fill="#E30A17" cx="530" cy="400" r="160"/><polygon fill="#fff" points="600,400 667,430 650,360 700,310 630,310 600,260 570,310 500,310 550,360 533,430"/></svg>
    </button>
    <button class="lang-btn" data-lang="en" title="English">
      <svg viewBox="0 0 60 30"><clipPath id="clipEN"><rect width="60" height="30"/></clipPath><g clip-path="url(#clipEN)"><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="4"/><path d="M30,0V30M0,15H60" stroke="#fff" stroke-width="10"/><path d="M30,0V30M0,15H60" stroke="#C8102E" stroke-width="6"/></g></svg>
    </button>
    <div class="theme-toggle" id="theme-toggle" title="Dark / Light">
      <div class="theme-toggle-knob" id="theme-knob"></div>
    </div>
  </div>
</div>

<div class="layout">
<aside>
  <div class="brand">Sentiment Trading <em>with LLM</em></div>
  <div class="brand-sub" data-i18n="brandSub">QUANT RESEARCH · BIST 30 · v0.5</div>
  <nav id="nav">
    <button class="active" data-page="overview" data-i18n="navOverview">Genel Bakış</button>
    <button data-page="backtest" data-i18n="navBacktest">Backtest Performansı</button>
    <button data-page="trades" data-i18n="navTrades">İşlem Geçmişi</button>
    <button data-page="shortlist" data-i18n="navShortlist">Bugünün Sıralaması</button>
    <button data-page="paper" data-i18n="navPaper">Paper Trading</button>
    <button data-page="methodology" data-i18n="navMethodology">Metodoloji</button>
  </nav>
</aside>

<main>
  <div id="page-overview"></div>
  <div id="page-backtest" class="hidden"></div>
  <div id="page-trades" class="hidden"></div>
  <div id="page-shortlist" class="hidden"></div>
  <div id="page-paper" class="hidden"></div>
  <div id="page-methodology" class="hidden"></div>

  <footer>

const t = (k) => (I18N[LANG] && I18N[LANG][k]) || k;

// Apply data-i18n to static elements
function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    el.innerHTML = t(k);
  });
  document.documentElement.lang = LANG;
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === LANG);
  });
}

function applyTheme() {
  document.documentElement.dataset.theme = THEME;
  const knob = document.getElementById('theme-knob');
  if (knob) knob.textContent = THEME === 'dark' ? '☾' : '☀';
}

// Sidebar nav
document.querySelectorAll('#nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('main > div[id^="page-"]').forEach(p => p.classList.add('hidden'));
    document.getElementById('page-' + btn.dataset.page).classList.remove('hidden');
    window.scrollTo(0, 0);
  });
});

// Language buttons
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    LANG = btn.dataset.lang;
    localStorage.setItem('sb_lang', LANG);
    applyStaticI18n();
    rerenderAll();
  });
});

// Theme toggle
document.getElementById('theme-toggle').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('sb_theme', THEME);
  applyTheme();
  rerenderAll();  // chart colors update
});

function kpi(label, value, sub, tone) {
  const cls = tone === 'pos' ? 'kpi-value pos' : tone === 'neg' ? 'kpi-value neg' : 'kpi-value';
  return `<div class="kpi"><div class="kpi-label">${label}</div><div class="${cls}">${value}</div>${sub ? `<div class="kpi-sub">${sub}</div>` : ''}</div>`;
}
function kpiGrid(cards) { return `<div class="kpi-grid">${cards.join('')}</div>`; }

  return `<div class="disclose${kind === 'info' ? ' disclose-info' : ''}">${text}</div>`;
}

async function loadAll() {
  try { DATA.backtest = await (await fetch('./data/backtest.json')).json(); } catch (e) {}
  try { DATA.trades = await (await fetch('./data/trades.json')).json(); } catch (e) {}
  try { DATA.shortlist = await (await fetch('./data/shortlist.json')).json(); } catch (e) {}
  try { DATA.paper = await (await fetch('./data/paper.json')).json(); } catch (e) {}
  try { DATA.paperBook = await (await fetch('./data/paper_book.json')).json(); } catch (e) {}
  rerenderAll();
}

function rerenderAll() {
  if (EQUITY_CHART) { try { EQUITY_CHART.destroy(); } catch(e){} EQUITY_CHART = null; }
  applyStaticI18n();
  renderMarketBanner();
  renderOverview(); renderBacktest(); renderTrades(); renderShortlist(); renderPaper(); renderMethodology();
}

function renderMarketBanner() {
  const banner = document.getElementById('market-banner');
  if (!banner) return;
  const market = DATA.paperBook?.market;
  if (!market) { banner.style.display = 'none'; return; }
  banner.style.display = 'flex';
  banner.className = 'market-banner ' + (market.is_trading_day ? 'open' : '');
  if (market.is_trading_day) {
    banner.innerHTML = `<span class="market-dot"></span><strong>BIST AÇIK</strong> · ${market.today} · Bot bugün top-N seçim yapacak`;
  } else {
    const lbl = LANG === 'tr'
      ? `<strong>BIST KAPALI</strong> · ${market.reason_closed || 'tatil'} · Sonraki açık gün: <strong>${market.next_trading_day}</strong> · Bot yeni pozisyon açmıyor`
      : `<strong>BIST CLOSED</strong> · ${market.reason_closed || 'holiday'} · Next session: <strong>${market.next_trading_day}</strong> · Bot is not opening new positions`;
    banner.innerHTML = `<span class="market-dot"></span>${lbl}`;
  }
}

// ── YEARLY COMPARISON ───────────────────────────────────────────────
function renderYearlyComparison(equity, colors) {
  const byYear = {};
  for (const row of equity) {
    const y = row.date.slice(0, 4);
    if (!byYear[y]) byYear[y] = { p: 1.0, b: 1.0, days: 0 };
    byYear[y].p *= (1.0 + row.ret_p);
    byYear[y].b *= (1.0 + row.ret_b);
    byYear[y].days += 1;
  }
  const years = Object.keys(byYear).sort();
  const portRets = years.map(y => (byYear[y].p - 1) * 100);
  const benchRets = years.map(y => (byYear[y].b - 1) * 100);

  // Chart
  const ctx = document.getElementById('chart-yearly');
  if (ctx) {
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: years,
        datasets: [
          { label: t('portfolio'), data: portRets, backgroundColor: portRets.map(v => v >= 0 ? 'rgba(74,222,128,0.75)' : 'rgba(239,68,68,0.75)'), borderRadius: 4, borderWidth: 0 },
          { label: 'XU100', data: benchRets, backgroundColor: benchRets.map(v => v >= 0 ? 'rgba(245,158,11,0.55)' : 'rgba(180,83,9,0.45)'), borderRadius: 4, borderWidth: 0 },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: colors.cText2, font: { family: 'DM Mono', size: 11 } } },
          tooltip: {
            backgroundColor: colors.cBg, titleColor: colors.cText, bodyColor: colors.cText2,
            callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y >= 0 ? '+' : ''}${c.parsed.y.toFixed(2)}%` },
          },
        },
        scales: {
          x: { ticks: { color: colors.cTick, font: { family: 'DM Mono', size: 12 } }, grid: { display: false } },
          y: { ticks: { color: colors.cTick, font: { family: 'DM Mono' }, callback: v => (v >= 0 ? '+' : '') + v + '%' }, grid: { color: colors.cGrid } },
        },
      },
    });
  }

  // Table
  const tableEl = document.getElementById('yearly-table');
  if (tableEl) {
    const rows = years.map(y => {
      const v = byYear[y];
      const pr = (v.p - 1) * 100;
      const br = (v.b - 1) * 100;
      const diff = pr - br;
      return `<tr>
        <td><strong>${y}</strong></td>
        <td class="num ${pr >= 0 ? 'pos' : 'neg'}">${(pr >= 0 ? '+' : '') + pr.toFixed(2)}%</td>
        <td class="num ${br >= 0 ? 'pos' : 'neg'}">${(br >= 0 ? '+' : '') + br.toFixed(2)}%</td>
        <td class="num ${diff >= 0 ? 'pos' : 'neg'}"><strong>${(diff >= 0 ? '+' : '') + diff.toFixed(2)} pp</strong></td>
        <td class="num">${v.days}</td>
      </tr>`;
    }).join('');
    // Toplam
    let totP = 1, totB = 1, totDays = 0;
    for (const y of years) { totP *= byYear[y].p; totB *= byYear[y].b; totDays += byYear[y].days; }
    const totPr = (totP - 1) * 100, totBr = (totB - 1) * 100, totDiff = totPr - totBr;
    const totalRow = `<tr style="border-top:2px solid var(--border)">
      <td><strong>Toplam</strong></td>
      <td class="num ${totPr >= 0 ? 'pos' : 'neg'}"><strong>${(totPr >= 0 ? '+' : '') + totPr.toFixed(2)}%</strong></td>
      <td class="num ${totBr >= 0 ? 'pos' : 'neg'}"><strong>${(totBr >= 0 ? '+' : '') + totBr.toFixed(2)}%</strong></td>
      <td class="num ${totDiff >= 0 ? 'pos' : 'neg'}"><strong>${(totDiff >= 0 ? '+' : '') + totDiff.toFixed(2)} pp</strong></td>
      <td class="num"><strong>${totDays}</strong></td>
    </tr>`;
    tableEl.innerHTML = `<table style="margin-bottom:22px">
      <thead><tr>
        <th>${t('btYearlyCol1')}</th>
        <th class="num">${t('btYearlyCol2')}</th>
        <th class="num">${t('btYearlyCol3')}</th>
        <th class="num">${t('btYearlyCol4')}</th>
        <th class="num">${t('btYearlyCol5')}</th>
      </tr></thead>
      <tbody>${rows}${totalRow}</tbody>
    </table>`;
  }
}

// ── MONTHLY RETURNS HEATMAP ─────────────────────────────────────────
function renderMonthlyHeatmap(equity) {
  const el = document.getElementById('returns-heatmap');
  if (!el) return;
  // Group daily returns into months: (last_eq_of_month / last_eq_of_prev_month) - 1
  const byMonth = {};
  for (const p of equity) {
    const key = p.date.slice(0, 7);  // YYYY-MM
    byMonth[key] = p.portfolio;  // overwrite to keep last of month
  }
  const months = Object.keys(byMonth).sort();
  const monthRets = {};
  for (let i = 1; i < months.length; i++) {
    const cur = byMonth[months[i]];
    const prev = byMonth[months[i-1]];
    monthRets[months[i]] = (cur / prev) - 1;
  }
  // Build year × month matrix
  const years = Array.from(new Set(months.map(m => m.slice(0,4)))).sort();
  const monthNames = LANG === 'tr'
    ? ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara']
    : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // Color scale: -10% → red, 0 → bg, +10% → green
  const colorFor = (r) => {
    if (r == null || isNaN(r)) return 'transparent';
    const clamped = Math.max(-0.10, Math.min(0.10, r));
    const intensity = Math.abs(clamped) / 0.10;
    if (clamped >= 0) {
      const a = 0.15 + intensity * 0.55;
      return `rgba(74, 222, 128, ${a.toFixed(2)})`;
    } else {
      const a = 0.15 + intensity * 0.55;
      return `rgba(239, 68, 68, ${a.toFixed(2)})`;
    }
  };

  let html = `<div class="heatmap-wrap"><table class="heatmap">
    <thead><tr><th></th>${monthNames.map(m => `<th>${m}</th>`).join('')}<th class="ytd">YTD</th></tr></thead>
    <tbody>`;
  for (const y of years) {
    let ytd = 1;
    let hasAny = false;
    let cells = '';
    for (let m = 1; m <= 12; m++) {
      const key = `${y}-${String(m).padStart(2,'0')}`;
      const r = monthRets[key];
      if (r != null && !isNaN(r)) { ytd *= (1 + r); hasAny = true; }
      const txt = r != null ? (r >= 0 ? '+' : '') + (r * 100).toFixed(1) : '';
      cells += `<td style="background:${colorFor(r)}"><span>${txt}</span></td>`;
    }
    const ytdRet = ytd - 1;
    const ytdTxt = hasAny ? (ytdRet >= 0 ? '+' : '') + (ytdRet * 100).toFixed(1) + '%' : '';
    html += `<tr><th class="year-label">${y}</th>${cells}<td class="ytd-cell ${ytdRet>=0?'pos':'neg'}">${ytdTxt}</td></tr>`;
  }
  html += `</tbody></table></div>`;
  el.innerHTML = html;
}

function renderTrades() {

    size_pct: x.size_pct, entry_price: x.entry_price, close_price: x.close_price,
    pnl_pct: x.pnl_pct, source: 'backtest',
  }));
  const liveTrades = (DATA.paperBook?.trades || [])
    .filter(t => t.status === 'CLOSED')
    .map(t => ({
      date: t.close_date || t.open_date,
      ticker: t.ticker, action: 'BUY',
      size_pct: 10, entry_price: t.entry_price, close_price: t.close_price,
      pnl_pct: t.pnl_pct, source: 'live',
    }));
  const allTrades = [...btTrades, ...liveTrades];

  if (!allTrades.length) { el.innerHTML = `<h1>${t('tradesEmpty')}</h1>`; return; }

function renderPnlHistogram(pnls) {
  const ctx = document.getElementById('chart-pnl-hist');
  if (!ctx || !pnls.length) return;
  // Bin edges every 0.5%
  const bw = 0.005;
  const mn = Math.floor(Math.min(...pnls) / bw) * bw;
  const mx = Math.ceil(Math.max(...pnls) / bw) * bw;
  const nBins = Math.max(8, Math.round((mx - mn) / bw));
  const bins = new Array(nBins).fill(0);
  for (const p of pnls) {
    const idx = Math.min(nBins - 1, Math.max(0, Math.floor((p - mn) / bw)));
    bins[idx]++;
  }
  const labels = [];
  const colors = [];
  for (let i = 0; i < nBins; i++) {
    const lo = mn + i * bw;
    labels.push(((lo + bw/2) * 100).toFixed(1) + '%');
    colors.push(lo + bw/2 >= 0 ? 'rgba(74,222,128,0.65)' : 'rgba(239,68,68,0.65)');
  }
  const css = getComputedStyle(document.documentElement);
  const cGrid = css.getPropertyValue('--chart-grid').trim();
  const cTick = css.getPropertyValue('--chart-tick').trim();
  const cBg = css.getPropertyValue('--bg').trim();
  const cText = css.getPropertyValue('--text').trim();
  const cText2 = css.getPropertyValue('--text2').trim();

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{ label: 'Trade count', data: bins, backgroundColor: colors, borderWidth: 0, barPercentage: 0.96, categoryPercentage: 0.96 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { backgroundColor: cBg, titleColor: cText, bodyColor: cText2, callbacks: { title: (ctx) => 'P&L ≈ ' + ctx[0].label } } },
      scales: {
        x: { ticks: { color: cTick, font: { family: 'DM Mono', size: 9 }, maxTicksLimit: 14 }, grid: { display: false } },
        y: { ticks: { color: cTick, font: { family: 'DM Mono' }, precision: 0 }, grid: { color: cGrid }, beginAtZero: true },
      },
    },
  });
}
