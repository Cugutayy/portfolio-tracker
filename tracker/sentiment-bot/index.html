const t = (k) => (I18N[LANG] && I18N[LANG][k]) || k;

// Apply data-i18n to static elements
function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    el.innerHTML = t(k);
  });
  document.documentElement.lang = LANG;
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === LANG);
  });
}

function applyTheme() {
  document.documentElement.dataset.theme = THEME;
  const knob = document.getElementById('theme-knob');
  if (knob) knob.textContent = THEME === 'dark' ? '☾' : '☀';
}

// Sidebar nav
document.querySelectorAll('#nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('main > div[id^="page-"]').forEach(p => p.classList.add('hidden'));
    document.getElementById('page-' + btn.dataset.page).classList.remove('hidden');
    window.scrollTo(0, 0);
  });
});

// Language buttons
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    LANG = btn.dataset.lang;
    localStorage.setItem('sb_lang', LANG);
    applyStaticI18n();
    rerenderAll();
  });
});

// Theme toggle
document.getElementById('theme-toggle').addEventListener('click', () => {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('sb_theme', THEME);
  applyTheme();
  rerenderAll();  // chart colors update
});

function kpi(label, value, sub, tone) {
  const cls = tone === 'pos' ? 'kpi-value pos' : tone === 'neg' ? 'kpi-value neg' : 'kpi-value';
  return `<div class="kpi"><div class="kpi-label">${label}</div><div class="${cls}">${value}</div>${sub ? `<div class="kpi-sub">${sub}</div>` : ''}</div>`;
}
function kpiGrid(cards) { return `<div class="kpi-grid">${cards.join('')}</div>`; }
function disclose(text, kind) {
  return `<div class="disclose${kind === 'info' ? ' disclose-info' : ''}">${text}</div>`;
}

async function loadAll() {
  try { DATA.backtest = await (await fetch('./data/backtest.json')).json(); } catch (e) {}
  try { DATA.trades = await (await fetch('./data/trades.json')).json(); } catch (e) {}
  try { DATA.shortlist = await (await fetch('./data/shortlist.json')).json(); } catch (e) {}
  try { DATA.paper = await (await fetch('./data/paper.json')).json(); } catch (e) {}
  rerenderAll();
}

function rerenderAll() {
  if (EQUITY_CHART) { try { EQUITY_CHART.destroy(); } catch(e){} EQUITY_CHART = null; }
  applyStaticI18n();
  renderOverview(); renderBacktest(); renderTrades(); renderShortlist(); renderPaper(); renderMethodology();
}

  const pm = DATA.backtest.portfolio_metrics;
  const bm = DATA.backtest.benchmark_metrics;

  el.innerHTML = `

    <h3>${t('btMetrics')}</h3>

      kpi('Sharpe', pm.sharpe.toFixed(2), `XU100: ${bm.sharpe.toFixed(2)}`, pm.sharpe > bm.sharpe ? 'pos' : 'neg'),
      kpi(t('btCagrShort'), FMT_PCT_S(pm.cagr, 1), `XU100: ${FMT_PCT_S(bm.cagr, 1)}`, pm.cagr > bm.cagr ? 'pos' : 'neg'),
      kpi(t('kpiMaxDd'), FMT_PCT(pm.max_dd, 1), `XU100: ${FMT_PCT(bm.max_dd, 1)}`, 'neg'),
      kpi(t('kpiHitRate'), FMT_PCT(pm.hit_rate, 1), `XU100: ${FMT_PCT(bm.hit_rate, 1)}`, 'neutral'),
      kpi(t('btDaily'), FMT_PCT_S(pm.mean_d, 3), `σ=${FMT_PCT(pm.std_d, 2)}`, 'neutral'),
      kpi(t('btTurnover'), FMT_PCT(pm.turnover_d || 0, 1) + '/d', t('btTurnoverSub'), 'neutral'),
    ])}

    <h3>${t('btConservativeH')}</h3>
    ${disclose(t('btConservative'))}
    <div class="slider-row">
      <label>${t('btSliderLabel')}</label>
      <input type="range" id="bias-slider" min="0" max="30" value="15" step="1">
      <span class="value" id="bias-value">15%</span>
    </div>
    <div id="bias-results"></div>

    <h3>${t('btFoldH')}</h3>
    <div id="fold-table"></div>
  `;

  // Theme-aware chart colors
  const css = getComputedStyle(document.documentElement);
  const cGrid = css.getPropertyValue('--chart-grid').trim() || '#252525';
  const cTick = css.getPropertyValue('--chart-tick').trim() || '#6b6b6b';
  const cText2 = css.getPropertyValue('--text2').trim() || '#a8a8a8';
  const cBg = css.getPropertyValue('--bg').trim() || '#0a0a0a';
  const cText = css.getPropertyValue('--text').trim() || '#e8e8e8';
  const cAccent = css.getPropertyValue('--accent').trim() || '#4ade80';
  const cGold = css.getPropertyValue('--gold').trim() || '#f59e0b';

  // Chart
  const ctx = document.getElementById('chart-equity').getContext('2d');
  const labels = DATA.backtest.equity.map(p => p.date);
  EQUITY_CHART = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: t('portfolio'), data: DATA.backtest.equity.map(p => p.portfolio), borderColor: cAccent, backgroundColor: 'rgba(74,222,128,0.07)', borderWidth: 2.5, fill: true, pointRadius: 0, tension: 0.1 },
        { label: 'XU100 BH', data: DATA.backtest.equity.map(p => p.benchmark), borderColor: cGold, borderDash: [4, 4], borderWidth: 1.5, pointRadius: 0, tension: 0.1, fill: false },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: cText2, font: { family: 'DM Mono' } } }, tooltip: { backgroundColor: cBg, titleColor: cText, bodyColor: cText2 } },
      scales: {
        x: { ticks: { color: cTick, font: { family: 'DM Mono', size: 10 }, maxTicksLimit: 12 }, grid: { color: cGrid } },
        y: { ticks: { color: cTick, font: { family: 'DM Mono' } }, grid: { color: cGrid } },
      },
    },
  });

  // Slider
  const slider = document.getElementById('bias-slider');
  const updateBias = () => {
    const pct = +slider.value;
    document.getElementById('bias-value').textContent = pct + '%';
    const mult = 1 - pct / 100;
    document.getElementById('bias-results').innerHTML = kpiGrid([
      kpi(t('btAdjSharpe'), (pm.sharpe * mult).toFixed(2), `raw ${pm.sharpe.toFixed(2)}`, pm.sharpe * mult > 0 ? 'pos' : 'neg'),
      kpi(t('btAdjCagr'), FMT_PCT_S(pm.cagr * mult, 1), `raw ${FMT_PCT_S(pm.cagr, 1)}`, pm.cagr * mult > 0 ? 'pos' : 'neg'),
    ]);
  };
  slider.addEventListener('input', updateBias); updateBias();

  document.getElementById('fold-table').innerHTML = `<table>
    <thead><tr><th>${t('btFoldCol1')}</th><th>${t('btFoldCol2')}</th><th class="num">${t('btFoldCol3')}</th><th class="num">${t('btFoldCol4')}</th></tr></thead>

    </tbody>
  </table>`;
}

    </div>

    <h3>${t('ledgerH')} <span style="color:var(--muted);font-style:normal;font-size:0.85rem;font-family:'DM Mono'">(<span id="trade-count">${DATA.trades.length}</span> ${t('records')})</span></h3>
    <div id="trades-table"></div>
  `;

  const applySort = (arr) => {
    const dir = TRADES_SORT.dir === 'asc' ? 1 : -1;
    return arr.slice().sort((a, b) => {
      if (a.date < b.date) return -1 * dir;
      if (a.date > b.date) return 1 * dir;
      return 0;
    });
  };

  const refresh = () => {
    const fa = document.getElementById('f-action').value;
    const ft = document.getElementById('f-ticker').value;
    const filtered = DATA.trades.filter(t => (!fa || t.action === fa) && (!ft || t.ticker === ft));
    TRADES_FILTERED = applySort(filtered);
    document.getElementById('trade-count').textContent = TRADES_FILTERED.length;
    renderTradesTable();
  };

  const setSort = (dir) => {
    TRADES_SORT.dir = dir;
    document.getElementById('sort-date-desc').classList.toggle('active', dir === 'desc');
    document.getElementById('sort-date-asc').classList.toggle('active', dir === 'asc');
    refresh();
  };

  document.getElementById('f-action').addEventListener('change', refresh);
  document.getElementById('f-ticker').addEventListener('change', refresh);
  document.getElementById('sort-date-desc').addEventListener('click', () => setSort('desc'));
  document.getElementById('sort-date-asc').addEventListener('click', () => setSort('asc'));
  TRADES_FILTERED = applySort(DATA.trades);
  renderTradesTable();
}
function renderTradesTable() {
  const el = document.getElementById('trades-table');
  const rows = TRADES_FILTERED.slice(0, 200);
  el.innerHTML = `<table>
    <thead><tr>
      <th>${t('colDate')}</th><th>${t('colTicker')}</th><th>${t('colAction')}</th>
      <th class="num">${t('colPos')}</th><th class="num">${t('colEntry')}</th>
      <th class="num">${t('colClose')}</th><th class="num">${t('colPnl')}</th>
    </tr></thead>
    <tbody>
      ${rows.map(r => `<tr>
        <td>${r.date}</td>
        <td><strong>${r.ticker}</strong></td>
        <td><span class="badge badge-${r.action.toLowerCase()}">${r.action}</span></td>
        <td class="num">${r.size_pct != null ? (r.size_pct >= 0 ? '+' : '') + r.size_pct.toFixed(1) + '%' : '–'}</td>
        <td class="num">${r.entry_price != null ? r.entry_price.toFixed(2) : '–'}</td>
        <td class="num">${r.close_price != null ? r.close_price.toFixed(2) : '–'}</td>
        <td class="num ${r.pnl_pct > 0 ? 'pos' : r.pnl_pct < 0 ? 'neg' : ''}">${r.pnl_pct != null ? FMT_PCT_S(r.pnl_pct, 2) : '–'}</td>
      </tr>`).join('')}
    </tbody>
  </table>
  ${TRADES_FILTERED.length > 200 ? `<div style="text-align:center;padding:14px;color:var(--muted);font-size:0.75rem">${t('first200')} ${TRADES_FILTERED.length})</div>` : ''}`;
}

// ── SHORTLIST (rank-only) ───────────────────────────────────────────
function renderShortlist() {
  const el = document.getElementById('page-shortlist');

  const items = DATA.shortlist.items;
  el.innerHTML = `
    <h2 style="margin-top:0">${t('slH')}</h2>
    <p class="caption">${t('slCaption').replace('{d}', DATA.shortlist.date).replace('{n}', items.length)}</p>

    ${disclose(t('slPrivacy'), 'info')}

    <h3>${t('slTop10')}</h3>
    <table>
      <thead><tr><th>${t('slCol1')}</th><th>${t('slCol2')}</th><th class="num">${t('slCol3')}</th></tr></thead>
      <tbody>
        ${items.map(it => `<tr>
          <td><strong>#${it.rank}</strong></td>
          <td><strong>${it.ticker}</strong></td>
          <td class="num">${it.close.toFixed(2)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
}
